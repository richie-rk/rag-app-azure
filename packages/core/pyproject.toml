[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "docchat-core"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.14.1,<3",
  "pydantic-core>=2.50.1,<3",
  "pydantic-settings>=2.16.0,<3",
  "sqlalchemy>=2.1.4,<3",
  "pyodbc>=5.3.0,<6",
  "azure-identity>=1.26.0,<2",
  "azure-core[aio]>=1.41.0,<2",
  "azure-cosmos>=4.17.1,<5",
  "azure-storage-blob>=12.31.0,<13",
  "azure-storage-queue>=12.18.0,<13",
  "azure-search-documents>=12.0.0,<13",
  "azure-ai-documentintelligence>=1.0.2,<2",
  "openai>=3.31.0,<4",
  "httpx2>=2.13.1,<3",
  "httpx>=0.28.1,<1",
  "pyjwt[crypto]>=2.15.1,<3",
  "azure-monitor-opentelemetry>=1.8.11,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b58,<2",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-instrumentation-logging>=0.66b0,<1",
]

[dependency-groups]
dev = ["jsonschema>=4.26.0,<5", "types-jsonschema>=4.26.0.20260518,<5"]
