# The default rules apply in full. The local compose services authenticate with two keys that
# Microsoft publishes for its emulators, so they are the only values allowed through; no path,
# commit or other pattern is allowlisted (01-repository.md section 5.7).

[extend]
useDefault = true

[[allowlists]]
description = "Published emulator keys: the Azurite devstoreaccount1 account key and the Cosmos DB emulator key"
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
  '''C2y6yDjf5/R\+ob0N8A7Cgv30VRDJIWEHLM\+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==''',
]
