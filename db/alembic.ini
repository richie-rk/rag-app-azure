# Alembic configuration of the DocChat schema history (80-data-model.md section 2.24).
# The connection comes from db/migrations/env.py, which builds it with
# docchat_core.sql.engine.connection_string("migrations"); no URL or credential lives here.

[alembic]
script_location = %(here)s/migrations
path_separator = os
# Revisions are NNNN_<snake_slug>.py, created with `alembic revision --rev-id NNNN -m "<slug>"`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
