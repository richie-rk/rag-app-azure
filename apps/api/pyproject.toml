[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "docchat-api"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "docchat-core",
  "fastapi>=0.143.1,<1",
  "starlette>=1.10.0,<2",
  "pydantic>=2.14.1,<3",
  "pydantic-core>=2.50.1,<3",
  "gunicorn>=26.2.0,<27",
  "uvicorn>=0.54.0,<1",
  "uvicorn-worker>=0.4.0,<1",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b2,<1",
  "azure-core>=1.41.0,<2",
  "azure-cosmos>=4.17.1,<5",
  "azure-storage-blob>=12.31.0,<13",
  "tiktoken>=0.14.0,<1",
  "sqlalchemy>=2.1.4,<3",
  "openai>=3.31.0,<4",
  "httpx>=0.28.1,<1",
]
