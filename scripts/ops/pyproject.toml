[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "docchat-ops"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "docchat-core",
  "azure-core[aio]>=1.41.0,<2",
  "azure-cosmos>=4.17.1,<5",
  "azure-identity>=1.26.0,<2",
  "azure-keyvault-secrets>=4.11.3,<5",
  "azure-storage-blob>=12.31.0,<13",
  "azure-storage-queue>=12.18.0,<13",
  "httpx>=0.28.1,<1",
  "openai>=3.31.0,<4",
  "opentelemetry-api>=1.45.1,<2",
  "pydantic>=2.14.1,<3",
  "sqlalchemy>=2.1.4,<3",
  "tiktoken>=0.14.0,<1",
]
[project.scripts]
docchat-ops = "docchat_ops.cli:main"
